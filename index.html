<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="shopify-api-key" content="9699d3ab216cb40e3635e61f083fca30">
<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
<title>Dekalo</title>
<link rel="icon" href="./Dekalo_Favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f3f2;--card:#fff;--tx:#141414;--mu:#6b6b6b;--ln:#e6e6e4;--ink:#0b0b0b;--ok:#0c7a43;--wa:#8a6100;--ba:#b3261e;--r:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 64px}
h1,h2,.big,.stat b,.pl-h b,.ring b{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.01em}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}.logo svg{width:18px;height:18px}
.logo.sm{width:40px;height:40px;margin-bottom:10px}
.brand b{font-family:"Space Grotesk",sans-serif;font-size:15px;letter-spacing:.08em;display:block;line-height:1.1}.brand span{color:var(--mu);font-size:12px}
.sp{flex:1}
/* bienvenida */
.hero{background:radial-gradient(120% 140% at 100% 0%,#2a2a2a 0%,#0b0b0b 55%);color:#f4f4f4;border-radius:22px;padding:26px 26px 18px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 20px 40px -24px #0008}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:260px;height:260px;border:34px solid #ffffff0d;border-radius:46px;transform:rotate(12deg)}
.hero-in{display:flex;gap:20px;align-items:center;justify-content:space-between;position:relative;z-index:1}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a8a8a8;margin-bottom:6px}
.hero h1{font-size:30px;margin:0 0 6px;line-height:1.1}
.hero p{margin:0;color:#c9c9c9;max-width:560px;font-size:14px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;flex:none;background:conic-gradient(#fff calc(var(--p)*1%),#ffffff1f 0);display:flex;align-items:center;justify-content:center}
.ring>div{width:78px;height:78px;border-radius:50%;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:22px;line-height:1}.ring span{font-size:10px;color:#a8a8a8;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;position:relative;z-index:1}
.stat{background:#ffffff0d;border:1px solid #ffffff14;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:#a8a8a8}.stat b{font-size:22px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat i{font-style:normal;font-size:11px;color:#8f8f8f}
.lnk{color:#fff;font-size:12px;text-decoration:none;opacity:.8}.lnk:hover{opacity:1;text-decoration:underline}
/* tarjetas */
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 0 #0000000a,0 0 0 1px #0000000d;padding:20px;margin-bottom:16px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 2px}
.card .sub{color:var(--mu);margin:0;font-size:13px}
.pill{font:700 12px "Space Grotesk",sans-serif;background:var(--ink);color:#fff;border-radius:99px;padding:4px 10px}
.bar{height:6px;border-radius:99px;background:#ececea;overflow:hidden;margin:0 0 14px}.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .4s}
.steps{display:grid;gap:10px}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--ln);border-radius:14px;transition:border-color .2s}
.step:hover{border-color:#cfcfcd}
.num{width:28px;height:28px;border-radius:50%;background:#efefed;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;font-family:"Space Grotesk",sans-serif}
.step.done{background:#fafaf9}.step.done .num{background:var(--ink);color:#fff}
.step .body{flex:1;min-width:0;display:grid;gap:6px}
.step b{display:block;font-size:14px}
.step .txt{color:var(--mu);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;border:1px solid #d6d6d4;background:#fff;color:var(--tx);font:inherit;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,transform .05s}
.btn:hover{background:#f6f6f5}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}.btn.pri:hover{background:#2b2b2b}
.btn.ghost{border-color:transparent;box-shadow:none;height:30px;padding:0 8px;color:var(--mu)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:default;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%;max-width:480px;margin:4px 0}
td,th{padding:4px 6px;text-align:left;font-size:13px}th{color:var(--mu);font-weight:600}
td input{width:100%;height:34px;border:1px solid #d6d6d4;border-radius:9px;padding:0 10px;font:inherit;background:#fff}
td input:focus{outline:2px solid var(--ink);outline-offset:-1px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#efefed;color:#3a3a3a}
.tag.ok{background:#e3f1df;color:var(--ok)}.tag.wa{background:#fff1d6;color:var(--wa)}.tag.dark{background:var(--ink);color:#fff}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:#efefed;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--mu);border-radius:8px}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 2px #0000001f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sheet{border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:#fff;transition:box-shadow .2s}
.sheet:hover{box-shadow:0 10px 24px -14px #0004}
.pv{background:repeating-conic-gradient(#ececea 0 25%,#fafaf9 0 50%) 0 0/14px 14px;display:flex;align-items:center;justify-content:center;padding:16px;min-height:180px;border-bottom:1px solid var(--ln)}
.pv canvas{max-width:100%;max-height:300px;box-shadow:0 0 0 1px #0000001f}
.meta{padding:14px;display:grid;gap:6px}
.meta .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meta a{color:var(--tx);font-weight:700;text-decoration:none;font-family:"Space Grotesk",sans-serif;font-size:15px}.meta a:hover{text-decoration:underline}
.mu{color:var(--mu);font-size:13px}
.files{display:none;padding:0 14px 14px;font-size:12px}.files.show{display:grid;gap:4px}.files a{color:#303030;word-break:break-all}
.prog{height:6px;background:#eee;border-radius:99px;overflow:hidden;display:none}.prog.show{display:block}.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .15s}
.empty{text-align:center;padding:36px 16px;color:var(--mu);border:1px dashed #d6d6d4;border-radius:14px}
.empty-ic{width:52px;height:52px;border-radius:14px;background:#efefed;color:var(--tx);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.empty b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px;font-family:"Space Grotesk",sans-serif}
.banner{padding:12px 14px;border-radius:12px;background:#f4f4f4;border:1px solid var(--ln);margin-bottom:16px;font-size:13px}
.banner.err{background:#fdecea;border-color:#f5c2bd;color:#6b1a14}
.err{color:var(--ba);font-size:12px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.pl{border:1px solid var(--ln);border-radius:16px;padding:18px;position:relative;background:#fff}
.pl.best{border-color:#bdbdbb}
.pl.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pl-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.pl-h b{font-size:18px}
.pl-p{margin-bottom:10px;color:var(--mu)}.pl-p .big{font-size:32px;font-weight:700;color:var(--tx)}
.pl ul{list-style:none;margin:0;padding:0;font-size:13px;display:grid;gap:7px}
.pl li{padding-left:20px;position:relative}.pl li::before{content:"";position:absolute;left:2px;top:5px;width:10px;height:6px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg)}
.pl li.neg{color:var(--mu)}.pl li.neg::before{border:0;width:6px;height:6px;border-radius:50%;background:#a8a8a8;top:7px;left:4px;transform:none}
.compare{margin-top:12px;padding:10px 14px;border-radius:12px;background:#f6f6f5;font-size:13px;color:#3a3a3a}
.help-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
details{border-top:1px solid var(--ln);padding:12px 0}details:first-of-type{border-top:0}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details summary::after{content:"+";font-weight:400;color:var(--mu)}details[open] summary::after{content:"–"}
details p{color:var(--mu);margin:8px 0 0}
.contact{background:var(--ink);color:#eee;border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.contact .logo{background:#fff}.contact .logo svg path{fill:#0b0b0b}.contact b{font-family:"Space Grotesk",sans-serif;font-size:17px;color:#fff}.contact p{color:#bdbdbd;margin:0 0 10px;font-size:13px}
.made{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mu);font-size:12px;margin-top:8px}.made b{font-family:"Space Grotesk",sans-serif;color:var(--tx);letter-spacing:.06em}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.fade{animation:fd .4s ease both}@keyframes fd{from{opacity:0;transform:translateY(6px)}}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:24px}.ring{width:76px;height:76px}.ring>div{width:62px;height:62px}.help-grid{grid-template-columns:1fr}}
/* producción */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.kpis>div{background:#f6f6f5;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.kpis span{font-size:12px;color:var(--mu)}.kpis b{font:700 24px "Space Grotesk",sans-serif}
.seg button em{font-style:normal;font-size:11px;background:#e4e4e2;border-radius:99px;padding:1px 6px;margin-left:4px}.seg button.on em{background:var(--ink);color:#fff}
.search{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid #d6d6d4;border-radius:10px;background:#fff;min-width:200px;color:var(--mu)}.search:focus-within{outline:2px solid var(--ink);outline-offset:-1px}.search input{border:0;outline:0;font:inherit;width:100%;background:transparent;color:var(--tx)}
.seg.ic button{padding:6px 9px;display:flex;align-items:center}
.btn.icon{width:34px;padding:0;flex:none}.btn.icon.on{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.grow{flex:1}
.pv{position:relative}.chip{position:absolute;left:10px;top:10px;background:#0b0b0bd9;color:#fff;font:700 11px "Space Grotesk",sans-serif;padding:3px 9px;border-radius:99px}.chip.q{left:auto;right:10px}
.thumbs{display:flex;gap:6px;align-items:center;min-height:34px}.thumbs a{width:34px;height:34px;border-radius:8px;overflow:hidden;background:repeating-conic-gradient(#ececea 0 25%,#fafaf9 0 50%) 0 0/8px 8px;border:1px solid var(--ln);display:block}.thumbs img{width:100%;height:100%;object-fit:contain}.thumbs span{font-size:12px;color:var(--mu)}
.acts{display:flex;gap:6px;margin-top:2px}
.sheet.done .pv{filter:grayscale(1);opacity:.7}
.list{display:grid;gap:8px}.lrow{display:grid;grid-template-columns:64px 1fr auto auto auto;gap:12px;align-items:center;border:1px solid var(--ln);border-radius:12px;padding:8px 10px;background:#fff}.lrow.done{background:#fafaf9}.lrow.done .lpv{filter:grayscale(1);opacity:.7}
.lpv{width:64px;height:64px;border-radius:8px;background:repeating-conic-gradient(#ececea 0 25%,#fafaf9 0 50%) 0 0/8px 8px;display:flex;align-items:center;justify-content:center;overflow:hidden}.lpv canvas{max-width:58px;max-height:58px}
.lmain{display:flex;flex-direction:column;min-width:0}.lmain a{font:700 15px "Space Grotesk",sans-serif;color:var(--tx);text-decoration:none}.lmain a:hover{text-decoration:underline}
.lrow .prog,.lrow .err,.lrow .ok-save{grid-column:1/-1}.focus{background:#f6f6f5;border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:13px}.focus a{color:var(--tx);font-weight:600}.ok-save{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:2px 0 4px;background:#e9f7ee;border-color:#b9e2c6;color:#14532d;text-decoration:none}
.grid .pv{min-height:0;padding:14px}.grid .pv canvas{max-height:210px}
.skc{height:320px;border-radius:14px;background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;animation:sk 1.2s infinite}
@media (max-width:760px){.kpis b{font-size:18px}.lrow{grid-template-columns:52px 1fr auto auto}.lrow .tag{display:none}.hide-s{display:none}.search{min-width:0;flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><svg viewBox="0 0 159 159" width="20" height="20" aria-hidden="true"><path fill="#ffffff" d="M21 0L97 0C108.6 0 118 9.4 118 21L118 55L145 55C152.73 55 159 61.27 159 69L159 145C159 152.73 152.73 159 145 159L69 159C61.27 159 55 152.73 55 145L55 118L21 118C9.4 118 0 108.6 0 97L0 21C0 9.4 9.4 0 21 0ZM21 14C17.13 14 14 17.13 14 21L14 97C14 100.87 17.13 104 21 104L55 104L55 69C55 61.27 61.27 55 69 55L104 55L104 21C104 17.13 100.87 14 97 14ZM55 104L55 118L118 118L118 55L104 55L104 104Z"/></svg></div>
    <div class="brand"><b>DEKALO</b><span id="tagline">Gang sheets DTF para tu tienda</span></div>
    <span class="sp"></span>
    <button class="btn" id="langBtn">EN</button>
  </div>
  <section class="hero fade" id="welcome"></section>
  <div id="banner"></div>
  <section class="card fade" id="setup"></section>
  <section class="card fade" id="orders"></section>
  <section class="card fade" id="plan"></section>
  <section class="card fade" id="help"></section>
  <div class="made"><svg viewBox="0 0 159 159" width="14" height="14" aria-hidden="true"><path fill="#6b6b6b" d="M21 0L97 0C108.6 0 118 9.4 118 21L118 55L145 55C152.73 55 159 61.27 159 69L159 145C159 152.73 152.73 159 145 159L69 159C61.27 159 55 152.73 55 145L55 118L21 118C9.4 118 0 108.6 0 97L0 21C0 9.4 9.4 0 21 0ZM21 14C17.13 14 14 17.13 14 21L14 97C14 100.87 17.13 104 21 104L55 104L55 69C55 61.27 61.27 55 69 55L104 55L104 21C104 17.13 100.87 14 97 14ZM55 104L55 118L118 118L118 55L104 55L104 104Z"/></svg> <span><b>DEKALO</b> · Preparado por Nero Illusion</span></div>
</div>
<script type="module" src="./app.js?v=8"></script>
</body>
</html>
